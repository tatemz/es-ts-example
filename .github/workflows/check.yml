name: Check

on:
  pull_request:
  push:
  schedule:
    # Nightly full mutation run so cached incremental state can never become the
    # only truth.
    - cron: "0 7 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (no mutation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run gates
        run: bun run check:without-mutation

  mutation:
    name: Mutation (${{ matrix.package }})
    runs-on: ubuntu-latest
    env:
      # Pull requests iterate fast on cached incremental state; push and
      # scheduled runs force a full rebuild so the incremental file stays honest.
      MUTATION_FULL: ${{ (github.event_name == 'pull_request') && '0' || '1' }}
      # Pin Stryker worker-process concurrency for stable shared-runner timing.
      # This is Stryker-level parallelism across mutants; the bun runner still
      # serializes tests within each worker for correct per-test coverage.
      MUTATION_STRYKER_CONCURRENCY: "4"
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@es-ts-example/web"
          - "@es-ts-example/cli"
          - "@es-ts-example/application"
          - "@es-ts-example/domain"
          - "@es-ts-example/event-sourcing"
          - "@es-ts-example/test-support"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Restore incremental mutation cache
        if: env.MUTATION_FULL == '0'
        uses: actions/cache@v4
        with:
          path: packages/*/reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ matrix.package }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ matrix.package }}-

      - name: Run mutation (incremental)
        if: env.MUTATION_FULL == '0'
        run: bun --filter "${{ matrix.package }}" mutation:dev -- --concurrency "$MUTATION_STRYKER_CONCURRENCY"

      - name: Run mutation (full)
        if: env.MUTATION_FULL == '1'
        run: bun --filter "${{ matrix.package }}" mutation -- --concurrency "$MUTATION_STRYKER_CONCURRENCY"

      - name: Mutation report health
        run: bun run lint:mutation-report-health

      - name: Mutation baselines
        run: bun run lint:mutation-baselines
